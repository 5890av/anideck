name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'app/manifest.ts'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK licenses & ensure build-tools
        run: |
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-34" "build-tools;34.0.0"

      - name: Generate signing keystore
        run: |
          keytool -genkeypair \
            -dname "CN=Anideck, OU=App, O=Anideck, L=Satna, ST=MP, C=IN" \
            -alias anideck \
            -keypass anideck123 \
            -keystore ./android.keystore \
            -storepass anideck123 \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

      - name: Generate Launcher Icon PNG
        run: |
          mkdir -p android-app/app/src/main/res/drawable
          python3 - << 'PYEOF'
          import zlib, struct
          w, h = 192, 192
          rows = []
          for y in range(h):
              row = bytearray([0])
              for x in range(w):
                  # Dark #0E1015 background with a sunset coral #FF6B4A center badge
                  dx, dy = x - w // 2, y - h // 2
                  if dx * dx + dy * dy <= 54 * 54:
                      row.extend([0xFF, 0x6B, 0x4A, 0xFF])
                  else:
                      row.extend([0x0E, 0x10, 0x15, 0xFF])
              rows.append(bytes(row))
          raw = b"".join(rows)
          def chunk(t, d):
              return struct.pack(">I", len(d)) + t + d + struct.pack(">I", zlib.crc32(t + d) & 0xffffffff)
          png = b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", struct.pack(">IIBBBBB", w, h, 8, 6, 0, 0, 0)) + chunk(b"IDAT", zlib.compress(raw)) + chunk(b"IEND", b"")
          with open("android-app/app/src/main/res/drawable/ic_launcher.png", "wb") as f:
              f.write(png)
          PYEOF

      - name: Scaffold Native Android WebView App
        run: |
          mkdir -p android-app/app/src/main/java/app/vercel/anideck
          mkdir -p android-app/app/src/main/res/values

          cat << 'EOF' > android-app/settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Anideck"
          include ':app'
          EOF

          cat << 'EOF' > android-app/build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat << 'EOF' > android-app/gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat << 'EOF' > android-app/app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'app.vercel.anideck'
              compileSdk 34

              defaultConfig {
                  applicationId "app.vercel.anideck"
                  minSdk 23
                  targetSdk 34
                  versionCode ${{ github.run_number }}
                  versionName "1.0.${{ github.run_number }}"
              }

              signingConfigs {
                  release {
                      storeFile file("../../android.keystore")
                      storePassword "anideck123"
                      keyAlias "anideck"
                      keyPassword "anideck123"
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat << 'EOF' > android-app/app/src/main/res/values/styles.xml
          <resources>
              <style name="Theme.Anideck" parent="android:Theme.Material.NoActionBar">
                  <item name="android:windowBackground">#0E1015</item>
                  <item name="android:statusBarColor">#0E1015</item>
                  <item name="android:navigationBarColor">#0E1015</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > android-app/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <application
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="Anideck"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.Anideck"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|screenLayout|keyboardHidden"
                      android:exported="true"
                      android:launchMode="singleTask">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > android-app/app/src/main/java/app/vercel/anideck/MainActivity.java
          package app.vercel.anideck;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.View;
          import android.view.ViewGroup;
          import android.webkit.CookieManager;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;

          public class MainActivity extends Activity {
              private static final String HOME_URL = "https://anideck-seven.vercel.app";
              private WebView webView;
              private View customView;
              private WebChromeClient.CustomViewCallback customViewCallback;
              private FrameLayout rootLayout;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  rootLayout = new FrameLayout(this);
                  rootLayout.setBackgroundColor(Color.parseColor("#0E1015"));

                  webView = new WebView(this);
                  webView.setBackgroundColor(Color.parseColor("#0E1015"));

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setLoadWithOverviewMode(true);
                  settings.setUseWideViewPort(true);
                  settings.setMixedContentMode(WebSettings.MIXED_CONTENT_COMPATIBILITY_MODE);

                  CookieManager.getInstance().setAcceptCookie(true);
                  CookieManager.getInstance().setAcceptThirdPartyCookies(webView, true);

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          Uri uri = request.getUrl();
                          String host = uri.getHost();
                          if (host != null && (host.equals("anideck-seven.vercel.app") || host.endsWith(".anilist.co") || host.equals("anilist.co"))) {
                              return false;
                          }
                          try {
                              startActivity(new Intent(Intent.ACTION_VIEW, uri));
                          } catch (Exception ignored) {
                          }
                          return true;
                      }
                  });

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onShowCustomView(View view, CustomViewCallback callback) {
                          if (customView != null) {
                              callback.onCustomViewHidden();
                              return;
                          }
                          customView = view;
                          customViewCallback = callback;
                          webView.setVisibility(View.GONE);
                          rootLayout.addView(customView, new FrameLayout.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT,
                              ViewGroup.LayoutParams.MATCH_PARENT
                          ));
                      }

                      @Override
                      public void onHideCustomView() {
                          if (customView == null) return;
                          rootLayout.removeView(customView);
                          customView = null;
                          if (customViewCallback != null) {
                              customViewCallback.onCustomViewHidden();
                              customViewCallback = null;
                          }
                          webView.setVisibility(View.VISIBLE);
                      }
                  });

                  rootLayout.addView(webView, new FrameLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT,
                      ViewGroup.LayoutParams.MATCH_PARENT
                  ));
                  setContentView(rootLayout);

                  if (savedInstanceState != null) {
                      webView.restoreState(savedInstanceState);
                  } else {
                      webView.loadUrl(HOME_URL);
                  }
              }

              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  super.onSaveInstanceState(outState);
                  if (webView != null) {
                      webView.saveState(outState);
                  }
              }

              @Override
              public void onBackPressed() {
                  if (customView != null) {
                      webView.getWebChromeClient().onHideCustomView();
                  } else if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Build Signed APK with Gradle 8.4
        run: |
          curl -fsSL "https://services.gradle.org/distributions/gradle-8.4-bin.zip" -o /tmp/gradle-8.4.zip
          unzip -q /tmp/gradle-8.4.zip -d /tmp
          /tmp/gradle-8.4/bin/gradle -p android-app assembleRelease --no-daemon
          cp android-app/app/build/outputs/apk/release/app-release.apk ./Anideck.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Anideck-Android-APK
          path: Anideck.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Anideck Android v1.0.${{ github.run_number }}
          body: "Standalone Native WebView Android APK for Anideck (`anideck-seven.vercel.app`)."
          files: Anideck.apk
