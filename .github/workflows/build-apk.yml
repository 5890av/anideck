name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'app/manifest.ts'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK licenses & ensure build-tools
        run: |
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-34" "build-tools;34.0.0"

      - name: Generate signing keystore
        run: |
          keytool -genkeypair \
            -dname "CN=Anideck, OU=App, O=Anideck, L=Satna, ST=MP, C=IN" \
            -alias anideck \
            -keypass anideck123 \
            -keystore ./android.keystore \
            -storepass anideck123 \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

      - name: Generate Launcher Icon PNG
        run: |
          mkdir -p android-twa/app/src/main/res/drawable
          if ! curl -fsSL "https://anideck-seven.vercel.app/apple-icon.png" -o android-twa/app/src/main/res/drawable/ic_launcher.png; then
            python3 - << 'PYEOF'
          import zlib, struct
          w, h = 192, 192
          raw = b"".join(b"\x00" + b"\xff\x6b\x4a\xff" * w for _ in range(h))
          def chunk(t, d):
              return struct.pack(">I", len(d)) + t + d + struct.pack(">I", zlib.crc32(t + d) & 0xffffffff)
          png = b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", struct.pack(">IIBBBBB", w, h, 8, 6, 0, 0, 0)) + chunk(b"IDAT", zlib.compress(raw)) + chunk(b"IEND", b"")
          with open("android-twa/app/src/main/res/drawable/ic_launcher.png", "wb") as f:
              f.write(png)
          PYEOF
          fi

      - name: Scaffold Android TWA Project
        run: |
          mkdir -p android-twa/app/src/main/res/values
          mkdir -p android-twa/app/src/main/res/xml

          cat << 'EOF' > android-twa/settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Anideck"
          include ':app'
          EOF

          cat << 'EOF' > android-twa/build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat << 'EOF' > android-twa/gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat << 'EOF' > android-twa/app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'app.vercel.anideck'
              compileSdk 34

              defaultConfig {
                  applicationId "app.vercel.anideck"
                  minSdk 21
                  targetSdk 34
                  versionCode ${{ github.run_number }}
                  versionName "1.0.${{ github.run_number }}"

                  manifestPlaceholders = [
                      hostName: "anideck-seven.vercel.app",
                      defaultUrl: "https://anideck-seven.vercel.app",
                      launcherName: "Anideck",
                      assetStatements: '[{"relation": ["delegate_permission/common.handle_all_urls"], "target": {"namespace": "web", "site": "https://anideck-seven.vercel.app"}}]',
                      webManifestUrl: "https://anideck-seven.vercel.app/manifest.webmanifest"
                  ]
              }

              signingConfigs {
                  release {
                      storeFile file("../../android.keystore")
                      storePassword "anideck123"
                      keyAlias "anideck"
                      keyPassword "anideck123"
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.browser:browser:1.8.0'
              implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
          }
          EOF

          cat << 'EOF' > android-twa/app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Anideck</string>
              <string name="asset_statements">
                  [{
                      "relation": ["delegate_permission/common.handle_all_urls"],
                      "target": {
                          "namespace": "web",
                          "site": "https://anideck-seven.vercel.app"
                      }
                  }]
              </string>
          </resources>
          EOF

          cat << 'EOF' > android-twa/app/src/main/res/values/colors.xml
          <resources>
              <color name="colorPrimary">#0E1015</color>
              <color name="colorPrimaryDark">#0E1015</color>
              <color name="navigationColor">#0E1015</color>
              <color name="backgroundColor">#0E1015</color>
          </resources>
          EOF

          cat << 'EOF' > android-twa/app/src/main/res/values/styles.xml
          <resources>
              <style name="Theme.Anideck" parent="Theme.AppCompat.NoActionBar">
                  <item name="colorPrimary">@color/colorPrimary</item>
                  <item name="colorPrimaryDark">@color/colorPrimaryDark</item>
                  <item name="android:windowBackground">@color/backgroundColor</item>
                  <item name="android:statusBarColor">@color/colorPrimaryDark</item>
                  <item name="android:navigationBarColor">@color/navigationColor</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > android-twa/app/src/main/res/xml/filepaths.xml
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <files-path name="shared" path="shared/" />
          </paths>
          EOF

          cat << 'EOF' > android-twa/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.Anideck">

                  <meta-data
                      android:name="asset_statements"
                      android:resource="@string/asset_statements" />

                  <activity
                      android:name="com.google.androidbrowserhelper.trusted.LauncherActivity"
                      android:exported="true"
                      android:label="@string/app_name"
                      android:theme="@style/Theme.Anideck">
                      <meta-data
                          android:name="android.support.customtabs.trusted.DEFAULT_URL"
                          android:value="https://anideck-seven.vercel.app" />
                      <meta-data
                          android:name="android.support.customtabs.trusted.STATUS_BAR_COLOR"
                          android:resource="@color/colorPrimary" />
                      <meta-data
                          android:name="android.support.customtabs.trusted.NAVIGATION_BAR_COLOR"
                          android:resource="@color/navigationColor" />
                      <meta-data
                          android:name="android.support.customtabs.trusted.SPLASH_IMAGE_DRAWABLE"
                          android:resource="@drawable/ic_launcher" />
                      <meta-data
                          android:name="android.support.customtabs.trusted.SPLASH_SCREEN_BACKGROUND_COLOR"
                          android:resource="@color/backgroundColor" />
                      <meta-data
                          android:name="android.support.customtabs.trusted.SPLASH_SCREEN_FADE_OUT_DURATION"
                          android:value="300" />
                      <meta-data
                          android:name="android.support.customtabs.trusted.FILE_PROVIDER_AUTHORITY"
                          android:value="app.vercel.anideck.fileprovider" />

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                      <intent-filter android:autoVerify="true">
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data
                              android:scheme="https"
                              android:host="anideck-seven.vercel.app" />
                      </intent-filter>
                  </activity>

                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="app.vercel.anideck.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/filepaths" />
                  </provider>
              </application>
          </manifest>
          EOF

      - name: Build Signed APK with Gradle 8.4
        run: |
          curl -fsSL "https://services.gradle.org/distributions/gradle-8.4-bin.zip" -o /tmp/gradle-8.4.zip
          unzip -q /tmp/gradle-8.4.zip -d /tmp
          /tmp/gradle-8.4/bin/gradle -p android-twa assembleRelease --no-daemon
          cp android-twa/app/build/outputs/apk/release/app-release.apk ./Anideck.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Anideck-Android-APK
          path: Anideck.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Anideck Android v1.0.${{ github.run_number }}
          body: "Signed Android APK for Anideck (`anideck-seven.vercel.app`). Download `Anideck.apk` below and install on Android."
          files: Anideck.apk
