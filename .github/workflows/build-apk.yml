name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'app/manifest.ts'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Generate signing keystore
        run: |
          keytool -genkeypair \
            -dname "CN=Anideck, OU=App, O=Anideck, L=Satna, ST=MP, C=IN" \
            -alias anideck \
            -keypass anideck123 \
            -keystore ./android.keystore \
            -storepass anideck123 \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

      - name: Initialize TWA project from live site
        run: |
          mkdir -p twa-project && cd twa-project
          cat << 'EOF' > twa-manifest.json
          {
            "packageId": "app.vercel.anideck",
            "host": "anideck-seven.vercel.app",
            "name": "Anideck",
            "launcherName": "Anideck",
            "display": "standalone",
            "themeColor": "#0E1015",
            "themeColorDark": "#0E1015",
            "navigationColor": "#0E1015",
            "navigationColorDark": "#0E1015",
            "navigationDividerColor": "#0E1015",
            "navigationDividerColorDark": "#0E1015",
            "backgroundColor": "#0E1015",
            "enableNotifications": true,
            "startUrl": "/",
            "iconUrl": "https://anideck-seven.vercel.app/apple-icon.png",
            "splashScreenFadeOutDuration": 300,
            "signingKey": {
              "path": "../android.keystore",
              "alias": "anideck"
            },
            "appVersionName": "1.0.0",
            "appVersionCode": 1,
            "shortcuts": [],
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "https://anideck-seven.vercel.app/manifest.webmanifest",
            "fallbackType": "customtabs",
            "features": {},
            "alphaDependencies": {
              "enabled": false
            },
            "enableSiteSettingsShortcut": true,
            "isChromeOSOnly": false,
            "isMetaQuest": false,
            "fullScopeUrl": "https://anideck-seven.vercel.app/",
            "minSdkVersion": 21,
            "orientation": "default",
            "fingerprints": []
          }
          EOF
          yes "" | bubblewrap update --manifest=twa-manifest.json || true

      - name: Build signed Android APK
        run: |
          cd twa-project
          export BUBBLEWRAP_KEYSTORE_PASSWORD=anideck123
          export BUBBLEWRAP_KEY_PASSWORD=anideck123
          yes | bubblewrap build --skipPwaValidation
          cp app-release-signed.apk ../Anideck.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Anideck-Android-APK
          path: Anideck.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Anideck Android v1.0.${{ github.run_number }}
          body: "Signed Android APK for Anideck (`anideck-seven.vercel.app`). Download `Anideck.apk` below and install on Android."
          files: Anideck.apk
